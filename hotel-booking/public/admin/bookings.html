<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manage Bookings — Kiri Stay Admin</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/index.html" class="brand">Kiri <span>Stay</span></a>
    <div class="nav-auth">
      <span class="muted">Admin: <span data-user-name></span></span>
      <a href="#" data-action="logout" class="btn btn-brass btn-sm">Log out</a>
    </div>
  </div>
</header>

<div class="dash-shell">
  <aside class="dash-side">
    <a href="/admin/index.html">Overview</a>
    <a href="/admin/analytics.html">Booking & Payments</a>
    <a href="/admin/rooms.html">Rooms</a>
    <a href="/admin/bookings.html" class="active">Bookings</a>
    <a href="/admin/users.html">Customers</a>
    <a href="/admin/messages.html">Messages</a>
    <div class="dash-side-label">Site Content</div>
    <a href="/admin/content.html#home">Home Page</a>
    <a href="/admin/content.html#why">Why Kiri Stay</a>
    <a href="/admin/content.html#onsite">On Site</a>
    <a href="/admin/content.html#guide">Building Guide</a>
    <a href="/admin/content.html#footer">Kiri Stay (footer)</a>
    <a href="/admin/content.html#about">About Page</a>
    <a href="/admin/content.html#contact">Contact Page</a>
  </aside>
  <main class="dash-main">
    <span class="eyebrow">Front desk</span>
    <h1>All bookings</h1>

    <div class="panel" style="margin-bottom:24px; max-width:360px;">
      <label for="checkin-time-input" style="font-size:0.85rem; font-weight:600;">Standard check-in time</label>
      <p class="muted" style="margin-top:2px;">Shown on every guest's check-in ID card.</p>
      <div class="flex gap-8" style="margin-top:8px;">
        <input type="text" id="checkin-time-input" placeholder="e.g. 2:00 PM" style="flex:1; padding:0.6em 0.8em; border:1px solid var(--line); border-radius:var(--radius); background:var(--ivory);" />
        <button type="button" class="btn btn-brass btn-sm" id="checkin-time-save">Save</button>
      </div>
      <div id="checkin-time-msg" class="msg" style="margin-top:8px;"></div>
    </div>

    <div id="bookings-table"><p class="muted">Loading…</p></div>
  </main>
</div>

<script src="/js/app.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/admin-bell.js"></script>
<script src="/js/admin-bookings.js"></script>
</body>
</html>
