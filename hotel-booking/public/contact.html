<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — Kiri Stay</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/index.html" class="brand">Kiri <span>Stay</span></a>
    <nav><ul class="nav-links">
      <li><a href="/index.html" data-i18n="nav.home">Home</a></li>
      <li><a href="/rooms.html" data-i18n="nav.rooms">Rooms</a></li>
      <li><a href="/about.html" data-i18n="nav.about">About</a></li>
      <li><a href="/contact.html" class="active" data-i18n="nav.contact">Contact</a></li>
    </ul></nav>
    <div class="nav-auth">
      <a href="/login.html" class="btn btn-outline btn-sm" data-auth="guest">Log in</a>
      <a href="/register.html" class="btn btn-brass btn-sm" data-auth="guest">Register</a>
      <a href="#" data-dashboard-link class="btn btn-outline btn-sm" data-auth="user" data-i18n="auth.dashboard">Dashboard</a>
      <a href="#" data-action="logout" class="btn btn-brass btn-sm" data-auth="user" data-i18n="auth.logout">Log out</a>
      <button class="nav-toggle" aria-label="Menu">☰</button>
    </div>
  </div>
</header>

<section class="section">
  <div class="container grid-2">
    <div>
      <span class="eyebrow" id="contact-eyebrow"></span>
      <h1 id="contact-heading"></h1>
      <p class="muted" id="contact-details"></p>
      <p class="muted" id="contact-hours"></p>
    </div>
    <div class="panel">
      <h3 class="mt-0">Send a message</h3>
      <div id="msg" class="msg"></div>
      <form id="contact-form">
        <div class="field"><label for="c-name">Name</label><input type="text" id="c-name" required /></div>
        <div class="field"><label for="c-email">Email</label><input type="email" id="c-email" required /></div>
        <div class="field"><label for="c-message">Message</label><textarea id="c-message" required></textarea></div>
        <button type="submit" class="btn btn-brass btn-block">Send message</button>
      </form>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div>
      <div class="brand" style="color:var(--ivory)">Kiri <span>Stay</span></div>
      <p id="footer-tagline" style="max-width:260px;color:rgba(250,247,241,0.55);margin-top:10px;">A small hotel, honestly run.</p>
    </div>
    <div class="foot-cols">
      <div><h4 data-i18n="footer.explore">Explore</h4><ul><li><a href="/rooms.html" data-i18n="nav.rooms">Rooms</a></li><li><a href="/about.html" data-i18n="nav.about">About</a></li><li><a href="/contact.html" data-i18n="nav.contact">Contact</a></li></ul></div>
      <div><h4 data-i18n="footer.account">Account</h4><ul><li><a href="/login.html" data-i18n="auth.login">Log in</a></li><li><a href="/register.html" data-i18n="auth.register">Register</a></li></ul></div>
    </div>
  </div>
  <div class="foot-bottom container">© 2026 Kiri Stay. Student capstone project.</div>
</footer>

<script src="/js/app.js"></script>
<script src="/js/i18n.js"></script>
<script>
let CACHED_CONTACT_CONTENT = {};
function renderContact(content) {
  CACHED_CONTACT_CONTENT = content;
  const c = content.contact || {};
  document.getElementById('contact-eyebrow').textContent = localText(c.eyebrow);
  document.getElementById('contact-heading').textContent = localText(c.heading);
  document.getElementById('contact-details').innerHTML = [localText(c.address), localText(c.phone), localText(c.email)].filter(Boolean).join('<br />');
  document.getElementById('contact-hours').textContent = localText(c.hours);
}
document.addEventListener('kiristay:content-ready', (e) => renderContact(e.detail.content || {}));
document.addEventListener('kiristay:lang-changed', () => renderContact(CACHED_CONTACT_CONTENT));

document.getElementById('contact-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = 'msg';
  const submitBtn = e.target.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  try {
    await API.post('/api/messages', {
      name: document.getElementById('c-name').value.trim(),
      email: document.getElementById('c-email').value.trim(),
      message: document.getElementById('c-message').value.trim(),
    });
    showMsg(msg, "Thanks — we'll reply within one business day.", 'success');
    e.target.reset();
  } catch (err) {
    showMsg(msg, err.data?.error || 'Could not send your message — please try again.', 'error');
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
