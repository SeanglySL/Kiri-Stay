<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Customers — Kiri Stay Admin</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/index.html" class="brand">Kiri <span>Stay</span></a>
    <div class="nav-auth">
      <span class="muted">Admin: <span data-user-name></span></span>
      <a href="#" data-action="logout" class="btn btn-brass btn-sm">Log out</a>
    </div>
  </div>
</header>

<div class="dash-shell">
  <aside class="dash-side">
    <a href="/admin/index.html">Overview</a>
    <a href="/admin/analytics.html">Booking & Payments</a>
    <a href="/admin/rooms.html">Rooms</a>
    <a href="/admin/bookings.html">Bookings</a>
    <a href="/admin/users.html" class="active">Customers</a>
    <a href="/admin/messages.html">Messages</a>
    <div class="dash-side-label">Site Content</div>
    <a href="/admin/content.html#home">Home Page</a>
    <a href="/admin/content.html#why">Why Kiri Stay</a>
    <a href="/admin/content.html#onsite">On Site</a>
    <a href="/admin/content.html#guide">Building Guide</a>
    <a href="/admin/content.html#footer">Kiri Stay (footer)</a>
    <a href="/admin/content.html#about">About Page</a>
    <a href="/admin/content.html#contact">Contact Page</a>
  </aside>
  <main class="dash-main">
    <span class="eyebrow">Registered accounts</span>
    <h1>Customers</h1>
    <div id="users-table"><p class="muted">Loading…</p></div>
  </main>
</div>

<script src="/js/app.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/admin-bell.js"></script>
<script>
function guardAdmin_(user) {
  if (!user) { window.location.href = '/login.html?next=/admin/users.html'; return false; }
  if (user.role !== 'admin') { window.location.href = '/dashboard.html'; return false; }
  return true;
}
async function load() {
  const el = document.getElementById('users-table');
  try {
    const { users } = await API.get('/api/users');
    el.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th></th></tr></thead>
          <tbody>${users.map((u) => `
            <tr>
              <td>${u.name}</td>
              <td>${u.email}</td>
              <td>${u.role}</td>
              <td>${new Date(u.createdAt).toLocaleDateString()}</td>
              <td>${u.role === 'customer' ? `<button class="btn btn-outline btn-sm" data-reset="${u.id}" data-name="${u.name}">Reset password</button>` : '—'}</td>
            </tr>`).join('')}</tbody>
        </table>
      </div>`;
    el.querySelectorAll('[data-reset]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm(`Reset the password for ${btn.dataset.name}? Only do this after verifying who they are (phone, in person, etc).`)) return;
        btn.disabled = true;
        try {
          const { tempPassword } = await API.post('/api/users/' + btn.dataset.reset + '/reset-password');
          showResetResult(btn.dataset.name, tempPassword);
        } catch (err) {
          alert(err.data?.error || 'Could not reset password.');
        } finally {
          btn.disabled = false;
        }
      });
    });
  } catch (e) {
    el.innerHTML = '<p class="muted">Could not load customers.</p>';
  }
}

function showResetResult(name, tempPassword) {
  const overlay = document.createElement('div');
  overlay.className = 'card-modal-overlay';
  overlay.innerHTML = `
    <div class="card-modal" style="max-width:380px;">
      <button type="button" class="card-modal-close" aria-label="Close">&times;</button>
      <div class="panel">
        <h3 class="mt-0">New temporary password</h3>
        <p class="muted">For <strong>${name}</strong>. This is shown once — pass it to the guest now (phone, in person, etc). They should change it after logging in.</p>
        <div class="pay-summary" style="margin-top:12px;"><span>Temporary password</span><strong class="am-mono" style="font-family:'IBM Plex Mono',monospace; font-size:1.1rem;">${tempPassword}</strong></div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  overlay.querySelector('.card-modal-close').addEventListener('click', close);
}
document.addEventListener('kiristay:auth-ready', (e) => {
  if (!guardAdmin_(e.detail.user)) return;
  load();
});
</script>
</body>
</html>
